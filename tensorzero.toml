# TensorZero Configuration for TinyContext

# Functions define the tasks we're tackling
[functions.tiny_reasoning]
type = "chat"

# Variant implementation for reasoning
[functions.tiny_reasoning.variants.default]
type = "chat_completion"
model = "openai::gpt-4o-mini"
temperature = 0.6
max_tokens = 512

[functions.tiny_action]
type = "chat"

# Variant implementation for action generation
[functions.tiny_action.variants.default]
type = "chat_completion"
model = "openai::gpt-4o-mini"
temperature = 0.7
max_tokens = 384

[functions.agent_selection]
type = "chat"

# Variant implementation for agent selection
[functions.agent_selection.variants.default]
type = "chat_completion"
model = "openai::gpt-4o-mini"
temperature = 0.3
max_tokens = 128

[functions.tiny_search]
type = "chat"

# Variant implementation for search
[functions.tiny_search.variants.default]
type = "chat_completion"
model = "openai::gpt-4o-mini"
temperature = 0.6
max_tokens = 2048

# RAG-specific functions for multi-agent workflows
[functions.rag_router]
type = "chat"

# Route queries to appropriate RAG agents
[functions.rag_router.variants.default]
type = "chat_completion"
model = "openai::gpt-4o-mini"
temperature = 0.3
max_tokens = 256

[functions.rag_think]
type = "chat"

# Strategic thinking and planning for RAG
[functions.rag_think.variants.default]
type = "chat_completion"
model = "openai::gpt-4o-mini"
temperature = 0.5
max_tokens = 512

[functions.rag_synthesize]
type = "chat"

# Synthesize final answers from gathered information
[functions.rag_synthesize.variants.default]
type = "chat_completion"
model = "openai::gpt-4o-mini"
temperature = 0.4
max_tokens = 1024
